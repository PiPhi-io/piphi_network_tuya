[project]
name = "piphi_network_tuya"
version = "0.1.1"
description = "PiPhi Tuya integration runtime built with piphi-runtime-kit-python."
authors = [
  { name = "KelvinSan", email = "support@piphi.network" },
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "tinytuya>=1.16.1,<2.0",
  "piphi-runtime-kit-python[fastapi]==0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "piphi-runtime-testkit-python==0.1.3",
]

[project.scripts]
piphi_network_tuya = "piphi_network_tuya.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_tuya"]
