name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
        working-directory: .

      - name: Run tests
        run: pytest
        working-directory: .

      - name: Validate checked-in metadata
        run: |
          python scripts/validate.py
          python scripts/release.py --bump patch --dry-run
        working-directory: .

      - name: Build Docker image
        run: docker build -t piphi-network-tuya:ci .
        working-directory: .
