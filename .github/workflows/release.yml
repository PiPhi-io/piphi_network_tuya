name: Release Tuya to Docker Hub

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version action
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease, release, custom]
      preid:
        description: Prerelease channel
        required: true
        default: alpha
        type: choice
        options: [alpha, beta, rc]
      custom_version:
        description: Explicit version when release_type is custom
        required: false
        type: string
      push_latest:
        description: Also publish latest for stable releases
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: tuya-release-${{ github.event.repository.full_name }}
  cancel-in-progress: false

env:
  RELEASE_IMAGE: piphinetwork/piphi-network-tuya
  DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require default branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Releases must run from the default branch." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          python -m compileall -q src tests scripts
          pytest
          python scripts/validate.py
          python scripts/release.py --bump patch --dry-run

      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ inputs.release_type }}" == "custom" ]]; then
            [[ -n "${{ inputs.custom_version }}" ]] || { echo "custom_version is required" >&2; exit 1; }
            VERSION=$(python scripts/release.py --set-version "${{ inputs.custom_version }}")
          else
            VERSION=$(python scripts/release.py --bump "${{ inputs.release_type }}" --preid "${{ inputs.preid }}")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [[ "$VERSION" == *-* ]] && echo "stable=false" >> "$GITHUB_OUTPUT" || echo "stable=true" >> "$GITHUB_OUTPUT"

      - name: Validate bumped release contract
        run: |
          python -m pip install .[dev]
          python -m json.tool src/manifest.json >/dev/null
          python -m json.tool experiences/devices/package.source.json >/dev/null
          pytest
          python scripts/validate.py

      - name: Validate release policy
        run: |
          if [[ "${{ inputs.push_latest }}" == "true" && "${{ steps.version.outputs.stable }}" != "true" ]]; then
            echo "latest cannot point at a prerelease" >&2
            exit 1
          fi
          TAG="v${{ steps.version.outputs.version }}"
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || { echo "$TAG already exists" >&2; exit 1; }
          [[ -n "${DOCKERHUB_OIDC_CONNECTIONID}" ]] || { echo "Docker Hub OIDC connection ID is missing" >&2; exit 1; }

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pyproject.toml \
            src/manifest.json \
            src/piphi_network_tuya/settings.py \
            experiences/devices/package.source.json
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      - name: Bind image to reviewed release contracts
        id: contracts
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum src/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "behaviors_sha256=$(sha256sum src/behaviors.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release revision
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Exchange Docker Hub OIDC token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection-id: ${{ env.DOCKERHUB_OIDC_CONNECTIONID }}

      - uses: docker/login-action@v4.5.0
        with:
          username: piphinetwork
          password: ${{ steps.docker_oidc.outputs.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RELEASE_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.push_latest && steps.version.outputs.stable == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.contracts.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.piphi.manifest.sha256=${{ steps.contracts.outputs.manifest_sha256 }}
            io.piphi.behaviors.sha256=${{ steps.contracts.outputs.behaviors_sha256 }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ steps.contracts.outputs.revision }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            MANIFEST_SHA256=${{ steps.contracts.outputs.manifest_sha256 }}
            BEHAVIORS_SHA256=${{ steps.contracts.outputs.behaviors_sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Package release assets and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp src/manifest.json "tuya-manifest-${VERSION}.json"
          cp src/behaviors.json "tuya-behaviors-${VERSION}.json"
          cp experiences/devices/package.source.json "tuya-experience-${VERSION}.json"
          sha256sum \
            "tuya-manifest-${VERSION}.json" \
            "tuya-behaviors-${VERSION}.json" \
            "tuya-experience-${VERSION}.json" \
            > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.stable != 'true' }}
          name: v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            tuya-manifest-${{ steps.version.outputs.version }}.json
            tuya-behaviors-${{ steps.version.outputs.version }}.json
            tuya-experience-${{ steps.version.outputs.version }}.json
            SHA256SUMS
